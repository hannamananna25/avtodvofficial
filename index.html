<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avtodvofficial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 16px;
  }
  h1 { font-size: 22px; margin-bottom: 16px; color: #111; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .card-body { padding: 12px 14px; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .card-sub { font-size: 13px; color: #666; margin-bottom: 8px; }
  .card-price { font-size: 18px; font-weight: 700; color: #0a7c4a; }
  .card-city { font-size: 13px; color: #888; margin-top: 4px; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
  <h1>Avtodvofficial</h1>
  <div id="app" class="grid">
    <div class="loading">Загрузка...</div>
  </div>

  <script>
    // ID таблицы из твоей ссылки и имя листа
    const SHEET_ID = '1tjipRM6wpMmLzd9gZEhXZxFHF9ezqESGpTj1oOG7xlY';
    const SHEET_NAME = 'Avtodvofficial';

    function formatPrice(n) {
      return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
    }
    function formatKm(n) {
      return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' км';
    }

    // Google вызовет эту функцию, когда отдаст данные
    google = { visualization: { Query: {} } };
    google.visualization.Query.setResponse = function(data) {
      const app = document.getElementById('app');
      try {
        if (!data || !data.table || !data.table.rows) {
          app.innerHTML = '<div class="loading">Нет данных</div>';
          return;
        }

        // Превращаем строки Google в обычные массивы
        const cars = data.table.rows
          .map(row => row.c.map(cell => cell ? (cell.f || cell.v) : ''))
          .filter(row => row[0] && row[1]);

        if (cars.length === 0) {
          app.innerHTML = '<div class="loading">Нет данных</div>';
          return;
        }

        app.innerHTML = cars.map(car => {
          const brand = car[0] || '';
          const model = car[1] || '';
          const price = parseFloat(String(car[3]).replace(/\s/g,'').replace(',','.')) || 0;
          const img   = car[4] || '';
          const year  = car[5] || '';
          const km    = parseFloat(String(car[6]).replace(/\s/g,'').replace(',','.')) || 0;
          const city  = car[14] || '';

          return `
            <div class="card">
              <img src="${img}" alt="${brand} ${model}" loading="lazy">
              <div class="card-body">
                <div class="card-title">${brand} ${model}</div>
                <div class="card-sub">${year} г. • ${formatKm(km)}</div>
                <div class="card-price">${formatPrice(price)}</div>
                <div class="card-city">${city}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        app.innerHTML = '<div class="loading">Ошибка: ' + e.message + '</div>';
      }
    };

    // Загружаем данные через JSONP — официальный способ Google
    const script = document.createElement('script');
    script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
                 '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME);
    document.head.appendChild(script);
  </script>
</body>
</html>
